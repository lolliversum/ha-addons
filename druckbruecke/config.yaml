name: Lolliversum Druckbrücke
version: "2026.11.05.1"
slug: lolliversum_druckbruecke
description: Holt Druckaufträge vom Lolliversum-Portal und gibt sie an Drucker im lokalen Netz (keine offenen Ports).
url: https://intranet.lolliversum.de/druck
arch: [aarch64, amd64]
init: false
startup: services
boot: auto
options:
  server: https://intranet.lolliversum.de
  standort: leon
  schluessel: ""
  netze: 192.168.178.0/24
  fritz_host: ""
  fritz_benutzer: ""
  fritz_passwort: ""
schema:
  server: url
  standort: list(hof|laden|leon)
  schluessel: password
  netze: str
  fritz_host: str?
  fritz_benutzer: str?
  fritz_passwort: password?
